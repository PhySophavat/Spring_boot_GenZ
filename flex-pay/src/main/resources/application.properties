spring.application.name=flex-pay
server.port=8081

spring.datasource.url=jdbc:postgresql://localhost:5432/flex-pays
spring.datasource.username=postgres
spring.datasource.password=123
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=false
spring.flyway.clean-on-validation-error=true
security.jwt.secret=${JWT_SECRET:flex-pay-development-secret-key-change-me-2026}
security.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
security.jwt.issuer=${JWT_ISSUER:flex-pay-api}

# Serialize LocalDateTime as ISO-8601 string, not numeric array
spring.jackson.serialization.write-dates-as-timestamps=false

# ─── Chat / File Upload ─────────────────────────────────────────────
app.upload.dir=${UPLOAD_DIR:./uploads}
app.upload.max-size-bytes=${UPLOAD_MAX_SIZE_BYTES:10485760}

# Allow multipart uploads up to 10 MB
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
