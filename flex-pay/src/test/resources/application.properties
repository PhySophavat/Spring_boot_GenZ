# Test profile: in-memory H2 (PostgreSQL compatibility mode) so integration tests
# can run without a live Postgres. Flyway is disabled and Hibernate generates the
# schema from JPA entities (ddl-auto=create-drop).
spring.datasource.url=jdbc:h2:mem:flex_pay_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

spring.flyway.enabled=false

security.jwt.secret=test-secret-key-for-integration-tests-only-not-for-production-2026
security.jwt.expiration-ms=86400000
security.jwt.issuer=flex-pay-api-test

spring.jackson.serialization.write-dates-as-timestamps=false

app.auth.otp-required=false
spring.mail.host=localhost
spring.mail.port=25

